<style>
*{box-sizing:border-box}body{margin:0;padding:14px;background:#f3f6f8;color:#1f2937;font-family:Arial,sans-serif}.app{max-width:920px;margin:auto}.header{height:210px;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#1769aa,#42a5f5);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px #0002;margin-bottom:14px}.header img{width:100%;height:100%;object-fit:cover;object-position:center 58%}.title{background:#fff;border-radius:16px;padding:15px;box-shadow:0 3px 12px #0001}.title h1{margin:0 0 4px;font-size:25px}.title p{margin:0;color:#667085}.card{margin-top:14px;background:#fff;border-radius:16px;padding:12px;box-shadow:0 3px 14px #0001;overflow:auto}table{width:100%;border-collapse:separate;border-spacing:5px;min-width:650px}th{padding:8px;font-size:14px}th:first-child{text-align:left;width:180px}.name{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:10px;font-size:16px;font-weight:bold;background:#fff}.name.c1{color:#e11d48}.name.c2{color:#2563eb}.name.c3{color:#16a34a}.name.c4{color:#9333ea}.name.c5{color:#ea580c}.name.c6{color:#0891b2}.name.c7{color:#db2777}.name.c8{color:#ca8a04}.cell{height:54px;border-radius:12px;background:#eef1f4;border:2px solid transparent;cursor:pointer}.cell.green{background:#45c76b}.cell.orange{background:#f5a623}.cell.red{background:#e5484d}.cell.absent{background:#7c3aed}.cell:after{content:"";display:block;width:18px;height:18px;border-radius:50%;background:#fff;opacity:.85;margin:auto;transform:translateY(16px)}.legend{display:flex;gap:18px;flex-wrap:wrap;margin:14px 2px 2px;font-size:14px}.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:5px}.g{background:#45c76b}.o{background:#f5a623}.r{background:#e5484d}button{border:0;border-radius:10px;padding:11px 15px;font-size:15px;cursor:pointer;background:#344054;color:#fff;margin-top:12px}.hint{font-size:13px;color:#667085;margin-top:9px}.report{margin-top:14px;background:#fff;border-radius:16px;padding:14px;box-shadow:0 3px 14px #0001}.report h2{margin:0 0 10px;font-size:20px}.reportGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.reportItem{border:1px solid #e4e7ec;border-radius:12px;padding:10px}.reportName{font-weight:700;margin-bottom:7px}.reportStats{display:flex;gap:6px;flex-wrap:wrap;font-size:13px}.stat{padding:5px 8px;border-radius:999px;font-weight:700}.stat.g{background:#dff7e7;color:#187a38}.stat.o{background:#fff0d5;color:#9a5b00}.stat.r{background:#fde1e2;color:#a51f25}.stat.a{background:#ede9fe;color:#6d28d9}.stat.e{background:#eef1f4;color:#667085}.reportTotal{margin-top:10px;font-size:13px;color:#667085}@media(max-width:600px){.header{height:165px}.title h1{font-size:22px}.reportGrid{grid-template-columns:1fr}}@media(max-width:600px){.header{height:165px}.title h1{font-size:22px}}
 .popup{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:9999}.popup.show{display:flex}.popupbox{background:#fff;border-radius:18px;padding:22px;max-width:420px;width:100%;box-shadow:0 10px 35px #0005;text-align:center}.popupbox h2{margin:0 0 10px;font-size:23px}.popupbox p{margin:0 0 18px;line-height:1.45}.popupbuttons{display:flex;gap:10px;justify-content:center}.contactcard{background:#f1f3f5;border-radius:14px;padding:12px;margin:0 0 14px}.contactcard #contactNumber{font-weight:700;font-size:20px;margin-bottom:9px}.copybtn{margin:0;background:#555!important;width:100%;padding:10px;border-radius:10px;color:#fff;border:0;font-weight:700}.popupbuttons .actionlink{margin:0;flex:1;background:#1976d2;color:#fff;text-decoration:none;border-radius:10px;padding:12px 10px;font-weight:700;display:flex;align-items:center;justify-content:center;box-sizing:border-box}.popupbuttons .actionlink.whatsapp{background:#25a244}.popupbuttons button:last-child{background:#25a244}</style></head>
<body><div class="app"><div class="header"><img src="bus.jpg?v=1" alt="Dorenbos Taxi bus"></div><div class="title"><h1>Dorenbos Weekoverzicht</h1><p>Beoordeling per kind · maandag t/m vrijdag</p></div><div class="popup" id="parentPopup"><div class="popupbox"><h2>⚠️ Let op</h2><p id="popupText"></p><div id="contactCard" class="contactcard"><div id="contactNumber"></div><button id="copyPhone" class="copybtn" type="button">📋 Nummer kopiëren</button></div><div class="popupbuttons"><a id="phoneLink" class="actionlink" href="tel:">📞 Bellen</a><a id="whatsappLink" class="actionlink whatsapp" href="https://wa.me/" target="_blank" rel="noopener">💬 Appen</a></div></div></div><div class="card"><table><thead><tr><th>Kind</th><th>Ma</th><th>Di</th><th>Wo</th><th>Do</th><th>Vr</th></tr></thead><tbody id="rows"></tbody></table><div class="legend"><span><i class="dot g"></i>Goed</span><span><i class="dot o"></i>Bijna goed</span><span><i class="dot r"></i>Niet goed</span><span style="color:#7c3aed;font-weight:700">🟣 Afwezig</span><span>⚪ Nog niet ingevuld</span></div><button onclick="clearWeek()">Week wissen</button><div class="hint">Alleen de kleuren worden gewist. De namen blijven staan.</div></div><div class="report"><h2>📊 Weekrapport</h2><div id="reportGrid" class="reportGrid"></div><div id="reportTotal" class="reportTotal"></div></div></div>
<script>const days=["ma","di","wo","do","vr"],names=["Abir","Thijs","Jill","Shay","Taha","Jayden","Miracle","Harley"],phones={"Abir":"+31623269090"},key="dorenbos_week_v1";let data={};try{data=JSON.parse(localStorage.getItem(key))||{}}catch(e){}function save(){localStorage.setItem(key,JSON.stringify(data))}function updateReport(){const grid=document.getElementById("reportGrid");if(!grid)return;grid.innerHTML="";let totalG=0,totalO=0,totalR=0,totalA=0,totalE=0;names.forEach((name,i)=>{let g=0,o=0,r=0,a=0,e=0;days.forEach(d=>{const v=data[i+"_"+d]||"";if(v==="green")g++;else if(v==="orange")o++;else if(v==="red")r++;else if(v==="absent")a++;else e++});totalG+=g;totalO+=o;totalR+=r;totalA+=a;totalE+=e;const item=document.createElement("div");item.className="reportItem";item.innerHTML="<div class=\"reportName\">"+name+"</div><div class=\"reportStats\"><span class=\"stat g\">🟢 "+g+"</span><span class=\"stat o\">🟠 "+o+"</span><span class=\"stat r\">🔴 "+r+"</span><span class=\"stat e\">⚪ "+e+"</span></div>";grid.appendChild(item)});document.getElementById("reportTotal").textContent="Totaal deze week: 🟢 "+totalG+" · 🟠 "+totalO+" · 🔴 "+totalR+" · 🟣 "+totalA+" · ⚪ "+totalE}function redCount(i){return days.filter(d=>data[i+"_"+d]==="red").length}function render(){const tb=document.getElementById("rows");tb.innerHTML="";names.forEach((name,i)=>{const tr=document.createElement("tr"),nt=document.createElement("td"),input=document.createElement("input");input.className="name c"+(i+1);input.value=name;input.readOnly=true;nt.appendChild(input);tr.appendChild(nt);days.forEach(day=>{const td=document.createElement("td"),cell=document.createElement("div");cell.className="cell "+(data[i+"_"+day]||"");cell.onclick=()=>{const c=data[i+"_"+day]||"";data[i+"_"+day]=c===""?"green":c==="green"?"orange":c==="orange"?"red":"";save();cell.className="cell "+data[i+"_"+day];updateReport();if(data[i+"_"+day]==="red"&&redCount(i)===3){window.currentChild=name;document.getElementById("popupText").innerHTML="<strong>"+name+" heeft deze week 3 keer rood gekregen.</strong><br><br>Wilt u nu de ouders van <strong>"+name+"</strong> bellen of appen?";setContactLinks(name);document.getElementById("parentPopup").classList.add("show");}};td.appendChild(cell);tr.appendChild(td)});tb.appendChild(tr)})}function closePopup(){document.getElementById("parentPopup").classList.remove("show")}function setContactLinks(name){const n=phones[name]||"";const digits=n.replace(/\D/g,"");document.getElementById("phoneLink").href=digits?"tel:"+digits:"tel:";document.getElementById("whatsappLink").href=digits?"https://wa.me/"+digits:"https://api.whatsapp.com/send?text="+encodeURIComponent("Bericht over "+name);document.getElementById("contactNumber").textContent=digits?(digits.startsWith("31")?"0"+digits.slice(2,3)+" "+digits.slice(3,5)+" "+digits.slice(5,7)+" "+digits.slice(7,9)+" "+digits.slice(9):digits):"Geen nummer ingesteld";document.getElementById("copyPhone").onclick=async()=>{if(!digits)return;try{await navigator.clipboard.writeText(n);document.getElementById("copyPhone").textContent="✅ Nummer gekopieerd";setTimeout(()=>document.getElementById("copyPhone").textContent="📋 Nummer kopiëren",1500)}catch(e){alert(n)}}}function clearWeek(){if(confirm("Alle kleuren van deze week wissen? De namen blijven staan.")){for(let i=0;i<8;i++)days.forEach(d=>delete data[i+"_"+d]);save();render();updateReport()}}render();updateReport();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js?v=20");</script></body></html>
